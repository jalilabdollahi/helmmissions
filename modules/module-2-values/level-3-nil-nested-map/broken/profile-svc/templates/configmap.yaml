apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  CACHE_HOST: {{ .Values.cache.redis.host | quote }}
  CACHE_PORT: {{ .Values.cache.redis.port | default 6379 | quote }}
