apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: fetcher
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /etc/fetcher/fetcher.env
              case "$FETCH_TIMEOUT" in
                ''|*[!0-9]*) echo "fetcher: invalid FETCH_TIMEOUT='$FETCH_TIMEOUT' (want seconds)" >&2; exit 1 ;;
              esac
              echo "fetcher: polling $FETCH_URL timeout=${FETCH_TIMEOUT}s retries=$FETCH_RETRIES"
              touch /tmp/ready
              while true; do sleep 5; done
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/fetcher
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
