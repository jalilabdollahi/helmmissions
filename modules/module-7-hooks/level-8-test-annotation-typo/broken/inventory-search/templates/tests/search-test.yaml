apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-search-test
  labels:
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": tests
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 2
  containers:
    - name: search-test
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          URL="http://{{ .Release.Name }}:{{ .Values.service.port }}/search?q={{ .Values.search.sampleQuery }}"
          echo "[test] GET $URL"
          out=""
          for attempt in 1 2 3 4 5; do
            out=$(curl -fsS --max-time 5 "$URL") && break
            echo "[test] attempt $attempt failed, retrying"; sleep 2
          done
          [ -n "$out" ] || { echo "[test] request failed" >&2; exit 1; }
          echo "$out"
          echo "$out" | grep -q '"hits":[1-9]' || { echo "[test] expected at least one hit" >&2; exit 1; }
          echo "[test] search returns results"
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}
