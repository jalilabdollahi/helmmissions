apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: migrate
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: LEDGER_DB_DSN
              value: {{ .Values.database.dsn | quote }}
          command:
            - sh
            - -c
            - |
              echo "[migrate] ledger schema migration starting"
              if [ -z "${LEDGER_DB_DSN:-}" ]; then
                echo "[migrate] FATAL: LEDGER_DB_DSN is not set, refusing to guess a database" >&2
                exit 64
              fi
              echo "[migrate] target database: ${LEDGER_DB_DSN##*@}"
              for m in 001_accounts 002_journal_entries 003_balance_view; do
                echo "[migrate] applied $m"
              done
              echo "[migrate] done: 3 migrations applied"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
