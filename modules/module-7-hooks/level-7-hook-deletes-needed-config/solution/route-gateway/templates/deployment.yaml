apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: route-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: route-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: route-gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: routes
              mountPath: /etc/nginx/conf.d
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: routes
          configMap:
            name: {{ .Release.Name }}-routes
