namespace: helmissions
replicaCount: 1
image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 80
app:
  name: hook-weight
containerPort: 80
env: []
config:
  message: Order Matters ready
featureFlags:
  enabled: true
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
securityContext: {}
rbac:
  create: false
hooks:
  enabled: false
  weight: bad
  deletePolicy: before-hook-creation,hook-succeeded
guard:
  expected: hook-weight
  actual: hook-weight
