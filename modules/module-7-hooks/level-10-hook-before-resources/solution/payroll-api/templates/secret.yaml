apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: payroll-api
  annotations:
    # hook with a lower weight than the bootstrap Job: it exists before the Job pod starts and stays afterwards
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DB_ROLE: {{ .Values.database.role | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
