apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-bootstrap
  labels:
    app.kubernetes.io/name: payroll-api
    app.kubernetes.io/component: db-bootstrap
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: bootstrap
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-db
          command:
            - sh
            - -c
            - |
              echo "[bootstrap] creating database role $DB_ROLE"
              if [ -z "${DB_PASSWORD:-}" ]; then echo "[bootstrap] FATAL: no password for $DB_ROLE" >&2; exit 1; fi
              echo "[bootstrap] role $DB_ROLE created (password length ${#DB_PASSWORD})"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
