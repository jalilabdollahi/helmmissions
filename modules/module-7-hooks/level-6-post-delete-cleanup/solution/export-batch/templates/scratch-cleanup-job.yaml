apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-scratch-cleanup
  labels:
    app.kubernetes.io/name: export-batch
    app.kubernetes.io/component: scratch-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-volumes
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: scratch-cleanup
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/persistentvolumeclaims/{{ .Release.Name }}-scratch"
              echo "[scratch-cleanup] deleting staging volume {{ .Release.Name }}-scratch"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" -X DELETE "$API")
              if [ "$code" != 200 ] && [ "$code" != 202 ] && [ "$code" != 404 ]; then echo "[scratch-cleanup] FATAL: could not delete the volume (HTTP $code)" >&2; exit 1; fi
              echo "[scratch-cleanup] done (HTTP $code)"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
