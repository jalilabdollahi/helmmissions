apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-dispatcher.fullname" . }}
  labels:
    {{- include "notification-dispatcher.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "notification-dispatcher.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
