apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-dispatcher.fullname" . }}
  labels:
    {{- include "notification-dispatcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notification-dispatcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-dispatcher.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: dispatcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ include "notification-dispatcher.fullname" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
