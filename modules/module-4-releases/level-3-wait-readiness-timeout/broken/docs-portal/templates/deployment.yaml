apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-portal
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: {{ .Values.readiness.path }}
              port: http
            periodSeconds: {{ .Values.readiness.periodSeconds }}
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: site
          configMap:
            name: {{ .Release.Name }}-site
