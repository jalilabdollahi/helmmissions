apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-usage-report
spec:
  schedule: {{ .Values.report.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 2
          containers:
            - name: report
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo usage report generated"]
