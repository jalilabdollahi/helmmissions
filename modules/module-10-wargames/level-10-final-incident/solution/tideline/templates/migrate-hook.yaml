apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: migrate
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: CURRENT, value: {{ .Values.schema.current | quote }}}
            - {name: TARGET, value: {{ .Values.schema.target | quote }}}
            - {name: SETTLE, value: {{ .Values.migration.settleSeconds | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              sleep "$SETTLE"
              if [ "$TARGET" -gt "$((CURRENT + 1))" ]; then
                echo "FATAL: refusing to skip migrations: schema is at $CURRENT, target is $TARGET"; exit 1
              fi
              echo "migrating schema $CURRENT -> $TARGET"
          resources:
            requests: {cpu: 5m, memory: 8Mi}
