apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cache
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: cache
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: CACHE_VERSION, value: {{ .Chart.Version | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "$CACHE_VERSION" > /www/version
              exec httpd -f -p 8080 -h /www
          ports:
            - name: cache
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: cache
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cache
spec:
  selector:
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: cache
      port: 8080
      targetPort: cache
