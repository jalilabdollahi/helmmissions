apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: billing
          image: "busybox:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: ENVIRONMENT, value: {{ .Values.environment | quote }}}
            - {name: BUILD, value: {{ .Values.image.tag | quote }}}
            - {name: PAYMENTS, value: {{ .Values.payments.mode | quote }}}
            - {name: DATABASE, value: {{ .Values.database.host | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              printf "environment=%s\nbuild=%s\npayments=%s\ndatabase=%s\n" "$ENVIRONMENT" "$BUILD" "$PAYMENTS" "$DATABASE" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
