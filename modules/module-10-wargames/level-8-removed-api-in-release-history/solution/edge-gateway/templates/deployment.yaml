apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: gateway
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: VERSION, value: {{ .Chart.AppVersion | quote }}}
            - {name: RATE_LIMIT, value: {{ .Values.rateLimit | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "edge-gateway version=$VERSION rate_limit=$RATE_LIMIT" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
