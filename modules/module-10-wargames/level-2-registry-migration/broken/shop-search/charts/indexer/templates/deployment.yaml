apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-indexer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-indexer
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: indexer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: WHOAMI_NAME, value: "{{ .Release.Name }}-indexer"}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
