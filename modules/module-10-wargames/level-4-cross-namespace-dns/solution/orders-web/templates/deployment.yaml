apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-web
    spec:
      terminationGracePeriodSeconds: 2
      dnsPolicy: {{ .Values.network.dnsPolicy }}
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: ORDERS_API_HOST, value: {{ .Values.ordersApi.host | quote }}}
            - {name: ORDERS_API_PORT, value: {{ .Values.ordersApi.port | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/dashboard <<'CGI'
              #!/bin/sh
              echo "Content-Type: text/plain"; echo
              printf "dashboard -> "
              wget -qO- -T 3 "http://$ORDERS_API_HOST:$ORDERS_API_PORT/orders" 2>&1 | head -1 || true
              CGI
              chmod +x /www/cgi-bin/dashboard
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
