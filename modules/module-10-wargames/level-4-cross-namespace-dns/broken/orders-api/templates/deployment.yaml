apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: OPEN_ORDERS, value: {{ .Values.openOrders | quote }}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "orders: $OPEN_ORDERS open (served from $POD_NAMESPACE)" > /www/orders
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
