apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: migrate
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET
              value: {{ .Values.migrations.target | quote }}
          command: ["sh", "-c"]
          args:
            - |
              echo "applying migrations up to $TARGET"
              case "$TARGET" in
                v1|v2|v3) echo "schema is now at $TARGET" ;;
                *) echo "FATAL: unknown migration target '$TARGET' - this release ships v1 v2 v3"; exit 1 ;;
              esac
          resources:
            requests: {cpu: 5m, memory: 8Mi}
