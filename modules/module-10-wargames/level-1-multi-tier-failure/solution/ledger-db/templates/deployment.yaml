apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-db
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: SCHEMA
              value: {{ .Values.migrations.target | quote }}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "pong schema=$SCHEMA" > /www/ping
              exec httpd -f -p 8080 -h /www
          ports:
            - name: sql
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: sql
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
