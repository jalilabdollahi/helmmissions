apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-api
    spec:
      terminationGracePeriodSeconds: 2
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_HOST, value: {{ .Values.db.host | quote }}}
            - {name: DB_PORT, value: {{ .Values.db.port | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              until wget -qO- -T 2 "http://$DB_HOST:$DB_PORT/ping" >/dev/null 2>&1; do
                echo "waiting for database at $DB_HOST:$DB_PORT"; sleep 2
              done
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_HOST, value: {{ .Values.db.host | quote }}}
            - {name: DB_PORT, value: {{ .Values.db.port | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/status <<'CGI'
              #!/bin/sh
              echo "Content-Type: text/plain"; echo
              printf "api ok -> db "
              wget -qO- -T 2 "http://$DB_HOST:$DB_PORT/ping" 2>/dev/null || echo "unreachable"
              CGI
              chmod +x /www/cgi-bin/status
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
