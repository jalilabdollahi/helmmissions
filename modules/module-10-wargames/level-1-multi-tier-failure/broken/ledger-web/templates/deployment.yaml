apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-web
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: API_UPSTREAM, value: {{ .Values.api.upstream | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www/cgi-bin
              cat > /www/cgi-bin/balance <<'CGI'
              #!/bin/sh
              echo "Content-Type: text/plain"; echo
              printf "web ok -> "
              wget -qO- -T 2 "http://$API_UPSTREAM/cgi-bin/status" 2>/dev/null || echo "upstream $API_UPSTREAM failed"
              CGI
              chmod +x /www/cgi-bin/balance
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
