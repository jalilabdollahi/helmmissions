apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Values.appName }}
        track: {{ .Values.track }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - {name: TRACK, value: {{ .Values.track | quote }}}
            - {name: VERSION, value: {{ .Values.version | quote }}}
            - {name: RELEASE, value: {{ .Release.Name | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "catalog $TRACK ($RELEASE) v$VERSION" > /www/index.html
              echo ok > /www/healthz
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            periodSeconds: 2
          resources:
            requests: {cpu: 2m, memory: 4Mi}
            limits: {memory: 32Mi}
