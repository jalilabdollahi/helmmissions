apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 2
      serviceAccountName: collector
      priorityClassName: helmissions-collector
      volumes:
        - name: www
          emptyDir: {}
      containers:
        - name: poller
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - {name: POLL, value: {{ .Values.pollSeconds | quote }}}
            - {name: TEAM, value: {{ .Values.team | quote }}}
          command: ["sh", "-c"]
          args:
            - |
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              while true; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 --cacert $SA/ca.crt \
                  -H "Authorization: Bearer $(cat $SA/token)" "https://kubernetes.default.svc/api/v1/pods?limit=1" || true)
                printf 'team=%s\npods-api=%s\n' "$TEAM" "$code" > /www/status.tmp && mv /www/status.tmp /www/status
                sleep "$POLL"
              done
          volumeMounts:
            - {name: www, mountPath: /www}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - {name: www, mountPath: /www}
          readinessProbe:
            httpGet: {path: /status, port: http}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 64Mi}
