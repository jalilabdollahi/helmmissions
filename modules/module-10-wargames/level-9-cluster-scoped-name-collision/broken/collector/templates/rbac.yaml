apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helmissions-pod-reader
  labels:
    helmissions.io/cleanup: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helmissions-pod-reader
  labels:
    helmissions.io/cleanup: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helmissions-pod-reader
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: helmissions-team-a
