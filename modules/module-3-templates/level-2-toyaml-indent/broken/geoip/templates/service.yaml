apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lookup
  labels:
    {{- include "geoip.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "geoip.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
