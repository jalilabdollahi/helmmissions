apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lookup
  labels:
    {{- include "geoip.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "geoip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geoip.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: lookup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 10 }}
