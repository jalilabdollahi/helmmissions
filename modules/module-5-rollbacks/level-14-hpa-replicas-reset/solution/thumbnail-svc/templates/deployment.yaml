apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: thumbnail-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thumbnail-svc
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: thumbs
          image: traefik/whoami:v1.10
          imagePullPolicy: IfNotPresent
          env:
            - name: BUILD_ID
              value: {{ .Values.buildId | quote }}
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
