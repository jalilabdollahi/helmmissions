apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: order-sync
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-sync
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: sync
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www
              if [ "$DB_POOL_SIZE" -ge 20 ]; then st=ok; else st="degraded - connection pool exhausted"; fi
              echo "order-sync pool=$DB_POOL_SIZE log=$LOG_LEVEL status=$st" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: DB_POOL_SIZE
              value: {{ .Values.db.poolSize | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
