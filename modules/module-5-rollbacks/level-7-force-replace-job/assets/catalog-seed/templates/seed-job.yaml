apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-seed
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: seed
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: SEED_VERSION
              value: {{ .Values.seed.version | quote }}
          command: ["sh", "-c", "echo seeding catalog with dataset v$SEED_VERSION; sleep 2"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
