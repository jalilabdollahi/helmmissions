apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timeseries-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timeseries-db
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: tsdb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: RETENTION
              value: {{ .Values.retention | quote }}
          command: ["sh", "-c", "echo retention=$RETENTION > /data/config; sleep 3600"]
          readinessProbe:
            exec:
              command: ["test", "-f", "/data/config"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
