namespace: helmissions
replicaCount: 1
image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 80
app:
  name: revision-gaps
containerPort: 80
env: []
config:
  message: Missing Revisions ready
featureFlags:
  enabled: false
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
securityContext: {}
rbac:
  create: false
hooks:
  enabled: false
  weight: 0
  deletePolicy: before-hook-creation,hook-succeeded
guard:
  expected: revision-gaps
  actual: broken-revision-gaps
