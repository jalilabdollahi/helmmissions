apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: quotes-api
spec:
  replicas: 1
  # single in-memory quote cache: the old pod must go before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quotes-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quotes-api
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: quotes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
