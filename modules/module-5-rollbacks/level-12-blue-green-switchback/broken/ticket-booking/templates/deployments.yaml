{{- range $color := list "blue" "green" }}
{{- $cfg := index $.Values $color }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $color }}
  labels:
    app.kubernetes.io/name: ticket-booking
    color: {{ $color }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-booking
      color: {{ $color }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-booking
        color: {{ $color }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: api
          image: "traefik/whoami:{{ $cfg.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["--name", "ticket-booking-{{ $color }}-{{ $cfg.release }}"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
{{- end }}
