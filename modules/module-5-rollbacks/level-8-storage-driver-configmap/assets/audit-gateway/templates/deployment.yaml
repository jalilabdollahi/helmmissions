apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: gateway
          image: traefik/whoami:v1.10
          imagePullPolicy: IfNotPresent
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
