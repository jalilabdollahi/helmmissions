apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sms-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sms-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms-gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: gateway
          image: traefik/whoami:v1.10
          imagePullPolicy: IfNotPresent
          args: ["--name", "sms-gateway-{{ .Values.carrier }}"]
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
