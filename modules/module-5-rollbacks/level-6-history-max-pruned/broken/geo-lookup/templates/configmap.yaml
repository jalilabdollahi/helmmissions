apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  default.conf: |
    server {
      listen 80;
      location /health {
        default_type text/plain;
        return 200 "ok\n";
      }
      location /lookup {
        default_type application/json;
    {{- if eq .Values.provider "maps-v2" }}
        return 200 '{"provider":"maps-v2","ttl":{{ .Values.ttl }},"trace":{{ .Values.trace }}}\n';
    {{- else }}
        return 503 '{"error":"provider {{ .Values.provider }} is retired"}\n';
    {{- end }}
      }
    }
