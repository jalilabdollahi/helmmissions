apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-flags
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-flags
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /flags.json
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: flags
              mountPath: /usr/share/nginx/html/flags.json
              subPath: flags.json
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: flags
          configMap:
            name: {{ .Release.Name }}-flags
