apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-routes
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $path, $target := .Values.routes }}
  {{ $path | trimPrefix "/" | quote }}: {{ $target | quote }}
  {{- end }}
