name: Removed APIs
description: |
  The Kubernetes platform team upgraded the cluster to v1.37 over the weekend. The `inventory-service` chart,
  which deployed fine on the old cluster, now refuses to install:
    Error: unable to build kubernetes objects from release manifest: [resource mapping not found for name:
    "inventory" namespace: "" from "": no matches for kind "PodDisruptionBudget" in version "policy/v1beta1"
    ensure CRDs are installed first, ... no matches for kind "HorizontalPodAutoscaler" in version
    "autoscaling/v2beta2" ...]
  Nothing was created and no CRDs are involved. The autoscaling and the disruption budget are both required
  for production.
objective: |
  Release `inventory` in namespace `helmissions` is deployed from the chart in your workspace with 2 Ready pods.
  Both the PodDisruptionBudget (min available 1) and the HorizontalPodAutoscaler (2 to 4 replicas, 70% CPU)
  exist in the cluster, created from API versions the cluster actually serves.
xp: 300
difficulty: advanced
expected_time: 15m
concepts:
  - removed Kubernetes APIs
  - apiVersion migration
  - PodDisruptionBudget
  - HorizontalPodAutoscaler
