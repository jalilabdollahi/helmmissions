apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "storefront.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "storefront.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: SESSION_STORE
              value: "{{ .Release.Name }}-session-cache:6379"
            - name: SESSION_TTL_MINUTES
              value: {{ .Values.sessionTTLMinutes | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
