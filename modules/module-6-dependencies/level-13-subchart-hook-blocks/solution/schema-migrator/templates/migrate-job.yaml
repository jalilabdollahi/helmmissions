apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-migrate
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: migrate
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
          command:
            - sh
            - -c
            - |
              echo "schema-migrator: target database host='${DB_HOST}'"
              if [ -z "${DB_HOST}" ]; then
                echo "DB_HOST is empty - refusing to run migrations" >&2
                exit 1
              fi
              echo "applying migrations to ${DB_HOST}"
              echo "migrations applied"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
