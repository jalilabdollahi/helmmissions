type: application
version: 1.4.0
appVersion: "4.0.1"
dependencies:
  - name: kvstore
    alias: primary
    version: 0.2.0
    repository: file://../kvstore
  - name: kvstore
    alias: replica
    version: 0.2.0
    repository: file://../kvstore
