apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: kv
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "{{ .Values.port }}", "-h", "/tmp"]
          env:
            - name: KV_MODE
              value: {{ .Values.mode | quote }}
            - name: KV_MAX_MEMORY_MB
              value: {{ .Values.maxMemoryMB | quote }}
          ports:
            - name: kv
              containerPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket:
              port: kv
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
